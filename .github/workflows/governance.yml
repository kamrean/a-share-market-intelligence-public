name: Governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Offline governance tests
        run: python -m unittest discover -s tests/governance -p test_*.py -v
      - name: Offline source and evidence tests
        run: python -m unittest discover -s tests/product -p test_*.py -v
      - name: Scope and canonical consistency
        run: python tools/governance.py check --ci
      - name: Verify deterministic prompt
        run: python tools/governance.py prompt --verify
      - name: Validate local review attestations
        run: python tools/governance.py gate --ci
      - name: Check committed patch whitespace
        run: git diff --check e7b36fb715a508c1e4ca91ac97a06b40bed2da7a HEAD
