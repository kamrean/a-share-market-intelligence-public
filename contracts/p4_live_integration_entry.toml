deliverables = ["Record actual PR #5 human merge, tested head, approved snapshot and successful PR/main CI. Preserve frozen P4 local receipts as historical; merge of the offline foundation does not close live gaps.","Governance-only entry: edit only current entry/state/policy/checker/governance tests/CI/docs/review files. No market_intelligence, config, product tests, historical receipts/samples or Blueprint v1 changes. No network product requests, credentials reads or live delivery.","Document one grouped implementation work package for P1-P4 integration gaps, not a PR per benchmark/agent/evidence item. State which existing synthetic-only boundaries require generalization and preserve offline behavior/tests. Do not promise that keys alone enable the existing runtime.","Pin the unchanged five-index denominator 000001.SH,399001.SZ,399006.SZ,KOSPI,SP500. Separate free availability, permission, entitlement, credentials, retention/AI-input/downstream rights, implementation and actual live verification. Never infer permitted use from a free webpage or third-party scraping library.","Commit a non-secret, source-located prerequisite register. All currently unverified rights/accounts/models/private destinations remain unknown or unmet, never invented not-owned or failed-probe results. No secrets, raw provider payloads, private chat identifiers, endpoint credentials or personal paths.","Keep effective external retrieval/model/private Telegram/scheduling/VPS/trading permissions false in state/contract/policy/checker. The follow-up permission amendment must pin exact allowed endpoints/methods/symbols, safe parsing, capture/retention/calendar rules, chosen model and budget, user-designated private sink and separate release. No wildcard grant and no production send.","Specify follow-up implementation surfaces and bounded negative tests in LIVE_INTEGRATION_PLAN. Authenticated client code may be written offline after provider selection, but live dispatch requires its actual audited stage authorization, valid entitlement/config and independent release decision; credentials alone do not authorize usage.","Define genuine MVP evidence: five live benchmarks plus at least one permitted primary news/event source; three dated end-to-end live runs with actual source/model/run times/errors and budgets; all or at least20 sampled claims checked by a human; local three-part report, real designated private Telegram test and linked correction; final independent review/release, CI and human merge.","Keep run mode and temporal possession strict. Separate capture IDs, first-seen, source publication, calendar/session and as_of; preserve empty event days, unavailable flow, unknown model usage and ambiguous delivery. Synthetic/replay fixtures, document audits and HTTP200 do not satisfy live evidence or permission.","Record MVP not_implemented, forward observation not_started, VPS not_authorized; Stage7 engineering_merged_live_gaps and Stage8 offline_subset_merged_live_gaps. This entry may become contract_prepared_unreleased, not implemented runtime, live-ready or full-blueprint complete.","Require actual independent entrypoint and Prompt Auditor before checker edits; Builder validation, independent read-only Reviewer and separate Release Checker; exact-head Windows/Linux CI and human merge. One new package R0/R1 cycle; no inherited exceptions or retries merely to obtain PASS.","Sanitize public files/history/logs, preserve verified noreply identity and protected main checks. No auto-merge, direct merge, force push or bypass. Stop AWAITING_HUMAN_MERGE."]
negative_tests = ["Retain all existing governance regression behaviors and all240 product tests unchanged. Only update active-package binding expectations where semantics changed; preserve prior artifact immutability, scope/index/branch/baseline, links/junctions, secret scanning, snapshot binding and role independence.","Reject any current permission expansion, endpoint activation, broker/order/portfolio/deploy/scheduler/production-send scope, unknown contract/state keys or replacement of historical files. Only four current P4L attestations are hash-exempt.","Reject promotion of the entry to runtime implemented, live-ready, MVP complete, observation complete or VPS authorized. Preserve0/5 live coverage and all current external prerequisites.","Bind the exact prerequisite register and grouped plan to Prompt Auditor and content snapshot. Reject missing/unknown/duplicate symbols, changed source/model/destination status or evidence-gap erasure, including rehashed stale approval.","Verify actual predecessor identity and CI, deterministic full-contract prompt rendering, complete current file lists and named staging. Preserve original BLOCK if any; second/unknown/R2+ finding escalates."]
receipt_rules = ["Only four current P4L attestations are exempt from the protected snapshot. Every prior P0-P4 product/config/test/contract/review/sample remains immutable. No inherited PASS approves new bytes.","One default R0/R1 repair and re-review. Prior P4 repair is historical and not a permission to retry this package indefinitely. Unknown/R2+ or second BLOCK requires human escalation.","Freeze contract/policy/entrypoint/plan/prerequisites, then actual entrypoint and Prompt Auditor PASS before checker edits. Freeze remaining state/log/checker/tests before independent review. Changed audit inputs invalidate prior approval.","Local release is LOCAL_READY_FOR_PR only for the governance entry; live readiness remains BLOCKED_EXTERNAL_PREREQUISITES. Frozen records retain NOT_RUN_AT_SNAPSHOT; subsequent exact-head CI/release/merge goes on PR.","Human merge is required. No direct merge/admin bypass/auto-merge/VPS. The follow-up implementation is grouped but needs concrete provider rights/model/private destination and its audited permission amendment; this entry has no operational authorization."]

