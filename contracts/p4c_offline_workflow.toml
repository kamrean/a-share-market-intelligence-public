deliverables = ["Record actual PR #6 human merge and successful exact-head PR/main CI; preserve all P0-P4L historical receipts and original240 product tests unchanged.","User-directed code-first sequence supersedes P4L provider-first order for offline code only. Same PR contains audited contract amendment and implementation; no external permission, credentials access, paid call, scheduler, trading, deployment or VPS.","Implement bounded configurable synthetic scenario schema using existing evidence, market/news/event, research, budget and evaluation validators; accept independent inputs instead of fixed demo hashes. Clearly label authored responses, never invent real model output or live coverage.","Implement self-contained verifiable scenario execution envelopes: bind inputs, method/entity/profile/config versions, scripted responses, claims, exact reviewer digests, editor selection, evaluation and actual execution metadata. Recompute substantive outputs and validate run/accounting metadata; do not trust caller supplied PASS or hashes alone.","Extend publication narrowly for scenario envelopes while keeping fixed P4 report bytes and all original validation semantics. Use scenario facts for provenance, three report parts, explicit gaps, bounded rendering, linked explanatory corrections with append-only same-dataset lineage. No unsafe generic live mode or asset-check bypass.","Provide one offline CLI: export an example, validate input, run a scenario, inspect recorded status, export a verified report, append an explanatory correction, optionally exercise local fake delivery. Never call live transports; default output is local only. Respect external runtime paths and reject links/junctions/hardlinks and overwrite hazards.","Persist one workspace's pinned configuration, task identity, inputs/execution receipts, budget store and report ledger. Repeated completed task returns recorded outcome without repeating research; changed task intent fails. Persist reservation before work, leave interrupted/unknown/blocked outcomes visible and do not blind retry, clear budgets, delete failures or silently heal corruption.","Keep counts/bounds for case bytes, work records, output bytes, roles/rounds, storage and per-run/day budget; runtime files stay outside checkout and no credentials are read. This package handles trusted local single-user operations, not concurrent hostile file mutation or cross-workspace global budgets.","Preserve five-index live denominator0/5, model/private-delivery unverified, research_mvp not_implemented, observation not_started and VPS not_authorized. Bot existence and self-private target are user-confirmed only; secret/config and real-send acceptance remain unverified. Model selection deferred by user with zero paid budget.","Run original offline suites plus new scenario/workflow regressions with network blocked; independent read-only entrypoint/Prompt Auditor before product/checker edits, independent Reviewer and separate Release Checker, exact-head CI and human merge. One R0/R1 repair and re-review; never erase original findings.","Publish concise operation/schema docs and construction log with explicit remaining final-integration tasks, not claims that an offline code merge completes live source/model/delivery or entire blueprint. Stop AWAITING_HUMAN_MERGE."]
negative_tests = ["Retain all original240 product tests and original governance protections; adjust only current-package binding expectations. Preserve baseline/index/worktree/scope, historical immutability, links/junctions, secret scanning, snapshot binding, separate roles and exact-head CI.","Reject malformed/duplicate/oversized/unknown-field case, missing required evidence, future/expired/conflicting/mixed-mode inputs, fake source or model success, wrong symbol/coverage and unavailable required domains.","Exercise at least two substantively different valid scenarios; reject changed payload/config/claim/review/editor/evaluation/accounting/timestamps even when hashes are recalculated. Never accept forged source wrappers as an escape from fixed P4 validation.","Exercise repeat task after restart, conflicting same task, interruption and unknown usage, failed reports, invalid ledger/config/database, correction lineage, output overwrite, unsafe paths/links/hardlinks, quota limits, malformed local delivery acknowledgement and secret-safe errors.","Reject any enabled external permission or readiness/MVP/observation/VPS promotion; pin user model deferral and private-sink status, full unchanged benchmark denominator and source prerequisite gaps. Only four current P4C attestations hash-exempt."]
receipt_rules = ["Only four current P4C attestations are hash-exempt. Preserve every prior contract/review/demo and all original tests; changed protected bytes invalidate approval.","Freeze Blueprint/entrypoint/contract/policy/plan/prerequisites and actual prompt, obtain real independent entrypoint and Prompt Auditor PASS before product or checker edits. Coordinator handles docs/state/log; bounded Builders have disjoint write sets.","One default in-scope R0/R1 repair and re-review across this package. Unknown/R2+ or second BLOCK requires human escalation; prior package exceptions do not transfer.","Freeze decision-affecting state/log and implementation before independent Reviewer and separate Release Checker; local release only LOCAL_READY_FOR_PR, never live acceptance. NOT_RUN_AT_SNAPSHOT is historical; later exact-head CI/release/merge belongs on PR.","No direct merge, admin bypass, auto-merge, production send or VPS. Model/provider/private test integration and any operational permission need final audited scope and separate release."]

