deliverables = ["Record actual P3 human merge and successful PR/main CI before implementation. Preserve every P0-P3 product/config/test/review artifact and Blueprint v1 unchanged; prior engineering completion is not live acceptance.","Python3.12 standard library only; add publication.py, ledger.py, delivery.py, p4_publication.toml and test_p4.py. No new dependencies, collector, live model, scheduler, credentials, network requests or real Telegram dispatch.","Verify/recompute the fixed authored P3 demo using existing verify_demo and original pinned assets before accepting publication input. This package supports only synthetic_test, explicitly labeled fixed-dataset local rendering, never a general live publication path. Later real integration must replace/extend this boundary under review.","Build a content-addressed daily_brief with exactly three ordered logical parts: sourced news/upcoming events; benchmarks and flow/turnover; sectors and approved impact claims with counterarguments and invalidation. Use deterministic structured results, exact approved claims and source locators, never new agent-generated statements. Every part includes report identity, as_of/mode, gaps and correction identity.","Keep research_id/run identity, bundle_id, claim IDs/full claims, review/evaluation, model/prompt/method/config fingerprints, mode and as_of in bounded report records before any delivery attempt. Publication guard revalidates exact report identity and recomputed content, action restrictions, required domains and source provenance. Synthetic historical as_of never becomes current market news through generated_at.","Corrections append a new immutable report with explicit supersedes and bounded reason; original records are never rewritten. Targets must exist, be the current lineage leaf and be in the same synthetic dataset/mode/as_of. Reject cycles, dangling links, forks, ordinary reports carrying supersedes and repeated corrections with conflicting IDs. A conservative explanatory correction need not claim new research facts.","Use a separate external SQLite ledger with application/schema/config identity checked read-only before mutation. Reject other/P1/P3 databases, links/junctions/hardlinks/checkout paths, corrupt schema and invalid records. Bound store bytes/report count/parts/attempts/text. One canonical store and transactional ownership/idempotency; reopening cannot reset accounting. No cross-store quota or tamperproof-database claim.","Persist three logical parts and deterministic bounded plain-text chunks with per-part/chunk identity and report binding. Reserve each simulated dispatch durably before calling trusted offline transport. Enforce order, one in-flight send, run/day attempt/volume/rate bounds and duplicate suppression across handles/restarts. Destination is a fixed synthetic sink, not a user Telegram destination.","Maintain queued/sent/failed/unknown outcomes with explicit simulated labels. Exceptions, invalid/missing receipt, timeouts or interrupted in-flight sends are unknown and stop later sends with no automatic retry. Definitive not-sent failure stops and cannot silently skip a part. Sent is only a valid bound fake acknowledgement, not real delivery. No exactly-once remote guarantee or automatic recovery of ambiguity.","Provide unavailable live Telegram adapter that performs no request or credential read. Offline transport implementations are trusted test code; reject unexpected modes before calls. Synchronous elapsed time checks are not hard cancellation guarantees; live release requires actual transport deadlines and current freshness checks.","Expose python -m market_intelligence.publication demo using fixed synthetic P3 input, ephemeral external stores, local three-part report and linked correction, simulated delivery receipts and labeled quality/error/missing-acceptance report. Actual run IDs/generated times remain separate from fixed historical as_of. Output reproducible content except documented actual execution metadata.","Commit sanitized raw CLI JSON and readable plain-text report sample generated from actual run; no SQLite/secret/private path/raw provider payload. Include offline correction, partial-failure and ambiguity demonstrations in tests and actual quality report. Do not manufacture live runs, human entailment labels or forward observations.","Keep full MVP not_implemented, live market0/5, model and real Telegram unverified, observation not_started and VPS not_authorized. Stage7/Stage8 status explicitly partial offline engineering. After human merge, plan one grouped reviewed live-integration/acceptance package for source/model/private destination gaps; do not advance automatically to long-window/VPS release."]
negative_tests = ["Retain all P0-P3 product tests and governance protections including immutable files, exact scope/index/snapshot/roles, secrets, links/junctions and baseline binding; tests block sockets/DNS.","Reject malformed or rehashed-but-invalid report/research/bundle, wrong modes/as_of, future/stale evidence, unsupported claims, omitted gaps, altered review/fingerprints, forbidden instructions, unknown schema fields and source/claim substitution.","Test exact three-part order, bounded Unicode plain-text chunking with stable identity, complete source/claim coverage, required limitations, empty news/event handling supported by fixed scope, no zero-filled unavailable flow and deterministic reproduction.","Test idempotent append/reopen, immutable originals and correction links; reject dangling/cyclic/forked/wrong-dataset corrections and conflicting duplicate identities. Preserve original content when correction validation fails.","Test reserve-before-send, duplicate/concurrent handles, sent restart, partial failure, ambiguous timeout/exception/invalid ack, interrupted in-flight record, strict sequencing, disabled live adapter zero calls and no blind retries.","Test persisted per-day/per-run attempts and volume, rate refusal, clock rollback, storage bounds, changed config/schema, unrelated databases and external path guards. Unknown send must survive restart without becoming sent.","Run actual offline CLI, verify sample against recomputed fixed content and metadata, and preserve missing live acceptance items; synthetic sent must never be called a real Telegram test or MVP completion."]
receipt_rules = ["Only four current P4 attestations are hash-exempt. Every P0/P1/P2/P3 review and product artifact is immutable. Old PASS never approves new bytes.","One default R0/R1 correction/re-review; count actual P4 cycles0 or1. Prior exceptions are historical. Further/unknown/R2+ BLOCK escalates to human.","Entrypoint review and Prompt Auditor PASS precede product implementation. Freeze state, methods, evidence and log before independent Reviewer and a separate Release Checker; changed inputs invalidate approval.","Local release is LOCAL_READY_FOR_PR, not live model, source, Telegram, CI or MVP acceptance. Frozen receipts retain NOT_RUN_AT_SNAPSHOT; later exact-head CI/release evidence belongs on PR.","Use verified noreply identity, public privacy checks and protected app-bound Windows/Linux CI. No direct merge, force push, admin bypass, auto-merge or VPS. Stop AWAITING_HUMAN_MERGE."]

