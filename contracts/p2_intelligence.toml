deliverables = ["Record actual P1 merge/head/PR CI/main CI and source gaps. Preserve P0/P1 contracts, source evidence and historical reviews unchanged. P1 Stage1 engineering is merged with source gaps; Stage2 core is merged, not research MVP completion.","Python3.12 standard library only; no new dependency. Implement market_state.py, news_events.py and intelligence.py with small validated APIs, two explicit method/entity configs, authored synthetic fixture and offline tests.","P2 adds no live retrieval. Active policy disables external_data_access_allowed. Existing P1 runtime remains unchanged; scope-limited P1 test updates use a temporary audited P1 policy fixture for injected transports, not a global permission mock. Actual active P2 policy must deny live P1 probe with zero dispatch.","Market methods preserve the five fixed benchmarks separately from the explicit bounded constituent/sector universe. Compute declared equal-weight returns, advancing/declining/unchanged breadth, turnover and sector rotation only from compatible sessions and complete available windows. Missing history is insufficient_history; no invented percentile, rank or zero fill.","Flow adapter returns typed unavailable state with provider, series kind and reason. Exchange statistics, provider estimates and turnover proxies remain distinct; no claim of live net-flow integration.","News pipeline bounds inputs, preserves source/mode/aware publication/retrieval/first-seen/expiry provenance, deduplicates without erasing member IDs, ranks with visible deterministic factors and decays stale items. Untrusted titles are data, never instructions; no fetches or executable outputs.","Versioned entity/sector mapping keeps aliases, provenance and ambiguity. Ambiguous or unknown matches remain unresolved, not arbitrary stock recommendations or fabricated identity.","Source-located event states: discovered, scheduled, approaching, awaiting_confirmation, confirmed, delayed, cancelled, expired, superseded. Time passing cannot confirm success. Planned future time differs from actual occurrence. Confirmation requires eligible non-Tier-C evidence and explicit actual occurrence; expected impact and observed reaction remain separate and unavailable unless supplied with evidence.","Compose domain-specific market/flow/sector/news/event/entity results with required/optional rules. Unknown rules, missing required validators, future/leaked/mixed-mode or contradictory input block. Fixed live market coverage remains0/5 and readiness BLOCKED_MARKET_SOURCES even for a passing synthetic demonstration.","Use the existing explicit-session Calendar interface, not weekdays or a claimed production holiday calendar. Pin method, universe, mapping, calendar, profile, mode and as_of. Freeze deterministic content hashes/references; preserve rejected reasons and never promote excluded evidence into usable claims.","Provide python -m market_intelligence.intelligence demo with clearly synthetic historical fixture as_of, actual generated UTC/run identity, bounded safe JSON and no product HTTP/DNS/model calls. Commit only a sanitized genuine CLI sample, not runtime databases or raw provider payloads.","One coherent PR includes implementation, tests, state/log/method docs and actual independent reviews. No scheduling, research committee/model, report/ledger/delivery, Telegram, VPS, broker/order/portfolio implementation."]
negative_tests = ["Preserve scope, index/worktree, symlink/junction, secret, immutable history, baseline, stale hash and independent-role checks.","Reject naive/future/after-as_of/mixed-mode input and unknown fields, calendars, symbols, methods and nonfinite/boolean numeric values.","Insufficient lookback/coverage cannot become zero or fabricated percentile; optional flow unavailable is explicit and cannot hide required-domain BLOCK.","Dedup preserves originals; stale/conflicting/Tier-C-only/ambiguous news and event confirmations cannot promote facts. Event arrival or elapsed time alone never means success.","All nine event states and illegal transitions, cancelled/delayed/superseded events, missing/unknown confirmation references and evidence-linked upcoming events are tested.","P1 injected transport tests are offline and isolated; real active P2 policy denies retrieval before any transport. No sockets/DNS/model/delivery calls in P2 tests.","Repeated inputs yield identical content identity; changed source/method/mapping/calendar/profile changes identity; tampered bundles and rejected-evidence promotion fail."]
receipt_rules = ["Only four current P2 attestations are hash-exempt; old P0/P1 reviews are protected and immutable. Old PASS cannot approve new bytes.","Default one R0/R1 repair and one re-review. P1 exception is retired historical evidence, never inherited by P2. Record actual P2 consumed cycles0 or1; a further BLOCK requires human escalation.","Prompt Auditor and entrypoint review precede implementation. Freeze all decisions before independent Reviewer and a separate Release Checker; changed inputs require validation/review again.","Local release is LOCAL_READY_FOR_PR, not remote CI/merge/source coverage/MVP acceptance. Preserve 0/5 gaps and frozen NOT_RUN_AT_SNAPSHOT facts.","Privacy-scan metadata, files, descriptions and CI logs. Verified noreply identity, exact app-bound protected CI, no direct merge/admin bypass/force push/auto-merge.","After exact-head CI and independent remote release verification stop at AWAITING_HUMAN_MERGE; no P3 implementation."]

