deliverables = ["Record PR8 human merge and successful exact-head PR/main CI. Preserve all prior contracts, observations, audits, product modules and358 product tests. Retain107 governance cases/protections; adapt only active-package bindings and add regressions.","Implement only market_intelligence/preparation.py and tests/product/test_preparation.py as new product surfaces. This is a retained-source evidence preparation boundary, not a completed live research/report pipeline. Existing synthetic-only research/publication/workflow APIs and modes remain unchanged.","All general external permissions remain false. No network calls or new source selection, credentials, paid calls, SDK/dependency installation, model, Telegram, scheduler, trading or VPS. Former P4S probe_gate must not be re-enabled by P4E.","One fixed local input is the already existing per-user p4s-fed-probe.sqlite, opened strictly read-only after independent Reviewer and separate LOCAL_READY_FOR_LOCAL_PREPARATION. Never create, reset, repair, sweep, copy, delete or mutate that store. No arbitrary CLI store/source/URL/as_of override.","Reuse existing external_path, existing-store schema verification, collection metadata inspection, retained parser, Fact and deterministic news processing where suitable. Bind the stored observation and original snapshot to immutable p4s-source-probe.json. Validate exact source/capture/attempt/evidence relationships and original hashes before using retained payload.","Check expiry against actual processing time BEFORE any raw or normalized payload is fetched or reparsed. Expired/missing/tombstoned/unavailable input returns a bounded honest unavailable result, never refetches or reconstructs text from a hash/summary. Keep original attempt and capture evidence unchanged.","Separate source_mode=live_observation from processing_mode=historical_replay. Preserve source as_of, publication/retrieval/first-seen and capture IDs. Do not create another source observation/live run or retroactively backfill possession; processed_at is a new local processing time only.","Prepare typed news Facts with explicit source-evidence/capture-to-fact provenance; retain original source mode and payload hash distinction. Evaluate at the original frozen as_of using its unchanged freshness profile. Preserve all stale/conflicting/rejected inputs in diagnostics, safely deduplicate eligible news, and leave entity/event/market/flow/sector gaps unresolved. No invented events, entities, forecasts, or market data.","Expose retained text only in an in-memory preparation API, not the default CLI or public artifact. CLI emits strictly bounded sanitized IDs/counts/timestamps/hashes/known status reasons, with prepared-content digest; no news titles/bodies/item URLs, personal paths, arbitrary exceptions, credentials or raw values. A content hash binds bytes, not source truth.","Keep original P4S result degraded, original news BLOCK and benchmark0/5. A prepared local input is NOT a PASS research bundle, source readiness, complete daily report, model integration, private delivery, MVP, forward observation or VPS acceptance.","Freeze protected code/state/log, validate all offline tests and scope/prompt/bundle/diff. Independent Reviewer and separate Release Checker precede actual retained-input read. Terminal missing/expired/corrupt input is recorded truthfully and does not imply data acceptance. Only the current preparation receipt may change after local read; final release binds its digest and preserves preapproval.","Require full exact-head Ubuntu/Windows CI and independent remote release, then stop AWAITING_HUMAN_MERGE. One R0/R1 repair/re-review total; unknown/R2+ or second BLOCK escalates. No auto/direct merge, bypass, force push or history rewrite."]
negative_tests = ["Preserve all358 original product tests and107 governance cases/protections, prior bytes, exact baseline/index/worktree/branch/scope, secret/link guards, protected snapshot and independent identities.","Reject every general external permission flip, new network capability or source selection. P4S probe_gate stays closed; no model/send/scheduler/trading/VPS. CLI cannot override input, source, profile/as_of or output payload disclosure.","Verify retained-input read-only behavior, exact prior observation/capture/run/attempt binding, missing/unrelated/corrupt/link/hardlink/oversize store refusal and no DB/journal creation or mutation. Tests block product sockets and credentials access.","Reject future/inconsistent possession, cross-mode relabeling, changed captures/records/hashes, current-clock rollback, expired or tombstoned raw/normalized reads. At exact expiry neither SQL nor parser may materialize expired payload.","Cover eligible, stale, duplicate/conflicting, external/non-Board locator, injection-like title, empty/unavailable/interrupted input, distinct capture versus Fact hashes, lossless exclusions and privacy-safe bounded diagnostics. Never report a fresh source run or news/market acceptance.","Validate strict actual preparation receipt and canonical result digest; final release rejects pending/forged/unbounded/leaking observations and preserves exact preapproval. Source failures are not permission to ignore code/test/CI failure."]
receipt_rules = ["Exactly five current P4E attestations are hash-exempt; all P4S and older artifacts including actual probe remain immutable. Actual entrypoint and Prompt Auditor inspect Blueprint/entrypoint/contract/policy/plan/template/prompt/AGENTS and immutable prerequisite/probe bytes before code/checker edits.","Local preapproval verdict LOCAL_READY_FOR_LOCAL_PREPARATION binds the frozen snapshot, independent Reviewer PASS and full offline validation. It only allows read-only inspection of retained input, never network requests or database mutation.","Final LOCAL_READY_FOR_PR preserves pre_preparation={verdict,snapshot_id,agent_id} and binds preparation_digest=sha256(canonical current preparation receipt). NOT_RUN is valid only before local inspection. Actual RECORDED output may be prepared or honestly unavailable; neither closes source/MVP readiness.","One R0/R1 repair and re-review total; prior package repair history is preserved but does not grant new scopes. Unknown/R2+ or second BLOCK escalates. Decision-affecting state/log freeze before review.","Frozen CI remains NOT_RUN_AT_SNAPSHOT; exact-head remote CI and independent release go on PR. Human merge only; no direct merge/admin bypass/auto-merge/VPS."]

