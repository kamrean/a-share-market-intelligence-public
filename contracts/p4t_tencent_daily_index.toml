schema_version = 1
package_id = "P4T"
stage_ids = [1, 2, 3]
title = "Bounded Tencent daily index replacement and validation"
objective = "Verify the replacement source, integrate a disabled-by-default daily adapter, validate freshness and duplicates, and independently release one user-requested technical observation without promoting unknown source rights."
branch = "stage1-tencent-index-replacement"
baseline = "3cceca6e1534484b9001db16644a98b7b068897b"
merge_tier = "D"
human_merge_required = true
auto_merge_allowed = false
max_repair_cycles = 1
blueprint_review_required = true
prompt_audit_required = true
independent_review_required = true
snapshot_algorithm = "sha256-path-and-lf-normalized-utf8-v1"
history_manifest = "governance/p4t-history.json"
immutable_rule = "Preserve the content-bound P4D and final-connection historical view; only the named mutable paths may differ from that view, and only named additions are allowed. Local checkpoint commit objects are provenance, never required ancestors after squash."
mutable_paths = [
  "AGENTS.md", "START_CONSTRUCTION_PROMPT.md", "README.md",
