deliverables = [
  "Record actual P0 PR/head/merge/CI evidence; preserve all P0 receipts and Blueprint bytes as immutable historical inputs. New branches omit codex/ by explicit user request.",
  "Keep one Python 3.12 standard-library application and SQLite store; requirements.lock states no third-party dependencies. No installation/network needed for offline tests.",
  "Source matrix pins Shanghai Composite 000001, Shenzhen Component 399001, ChiNext 399006, KOSPI and S&P 500, with source/terms URLs, session/timezone/delay, retention, access state and honest gaps. Do not change targets to easier proxies.",
  "Only the Board of Governors official press RSS endpoint https://www.federalreserve.gov/feeds/press_all.xml may be dispatched in P1, after Prompt Auditor PASS and explicit CLI opt-in. Official RSS and disclaimer pages establish the bounded use basis. No authentication, cookies, paywall bypass, unapproved scraping, feed-link fetching or source substitution.",
  "Market CSV normalization and paid-provider interfaces are implemented and tested offline. Unknown permissions, missing API keys, disabled paid adapters and unresolved index coverage make zero requests; they remain unavailable or disabled, never live_verified.",
  "Capture task/run IDs, UTC aware capture/first-seen times, response/content hashes, parser versions, source locators, request outcomes and idempotency keys. Use SQLite transactions for bounded task leases and request-budget reservations; preserve interrupted runs and unknown usage.",
  "Bound each run to two requests, daily total to twelve, response size to 512000 bytes, timeout to ten seconds, retry to one and concurrency to one. Reserve budgets before each attempt; no unknown-usage refunds or duplicate idempotent dispatch. Bound storage and keep runtime artifacts outside the repository.",
  "Validated evidence schemas distinguish source authority from observed operational quality, all explicit run modes, unknown timestamps, and source versions. No inference of event occurrence from publication time; live evidence must have been captured and first seen by as_of.",
  "Domain Evidence Gate evaluates required/optional domains, exact universe, freshness, conflicts, numeric validity, Tier-C-only confirmation, calendar/session identity and confidence ceilings. Missing required validators block. Unknown domains, rules or fields fail closed. Optional gaps remain explicit, never zero-filled.",
  "Provide versioned explicit-session calendar interface without claiming a production holiday calendar. Freeze deterministic bundles with source/evidence/parser/calendar/profile/method versions. Rejected evidence cannot silently enter a PASS bundle.",
  "Retention classes are enforced before writes: restricted payloads not stored; metadata_only not replayable; permitted expiring raw removed by explicit sweep with immutable tombstone metadata; replay requires actual retained hash-matching payload and marks historical_replay. Frozen bundles contain references/hashes, not undeletable raw payload copies.",
  "Provide offline synthetic demo and opt-in read-only probe CLI. Probe output preserves actual run/time, request/error/coverage counts and quality denominator; no raw feed payload, private paths, credentials or personal contact details committed.",
  "Freeze source matrix after the actual permitted probe. If any index source remains unverified, state and sample result remain BLOCKED_MARKET_SOURCES, independent of engineering/test PASS. A single RSS success is not full Stage1 source coverage, live research acceptance or forward observation.",
  "One coherent PR contains implementation, tests, source evidence, state/log and independent reviews. No scheduling, models, Telegram, ledger/report, sector methods, event/entity validators, VPS or trading implementation.",
]
negative_tests = [
  "Existing staged/index/worktree, secret, out-of-scope, symlink/junction, baseline/branch, stale prompt/snapshot and independent-review protections remain effective.",
  "P0 historical receipts/Blueprint cannot be edited, deleted or excluded from protected content; forged prior merge, runtime permission expansion, old branch prefix or remote creation are rejected.",
  "Offline tests cannot perform HTTP/DNS; unknown source/destination, redirects, private addresses, oversized responses, XML entities/DTD, malformed input and non-finite or boolean market values fail closed.",
  "Naive/future timestamps, first_seen/retrieved after as_of, replay presented as live, unknown calendars, unsupported domains, stale/missing/conflicting or Tier-C-only required facts block.",
  "Expired/restricted/metadata-only payloads cannot replay; hash mismatch blocks; expired normalized records cannot masquerade as fresh evidence. Tombstones and prior run outcomes remain.",
  "Duplicate tasks, concurrent leases, interrupted/unknown usage, per-run/day exhaustion and retry consumption are tested using temporary SQLite stores; budget denial occurs before any network request.",
  "Optional missing data degrades only under an explicit profile rule; unknown required validator, inadequate benchmark universe or market coverage cannot be hidden by a news-domain PASS.",
]
receipt_rules = [
  "Four current P1 attestations only are snapshot-exempt; every old P0 receipt remains immutable and protected. Old PASS never approves new bytes.",
  "Freeze source observations, state, log and other decisions before independent Reviewer. Any protected change invalidates approvals; default one R0/R1 correction and one re-review maximum. The named user-authorized repair_exception permits exactly one additional correction/re-review for its defect; another BLOCK escalates. Preserve prior review history in CONSTRUCTION_LOG.md and count both consumed cycles.",
  "Independent Prompt Auditor approves the contract/permission transition and entrypoint before implementation or live capture. Source research is not independent implementation review.",
  "Local release verdict LOCAL_READY_FOR_PR is not remote CI, merged completion, source completeness or deployment authorization. Missing external evidence remains a recorded gap.",
  "Before every public push scan new metadata, files and public text for privacy/credentials. Preserve verified noreply identity and existing main protection; no remote creation, direct merge or bypass.",
  "After exact-head CI and independent remote release verification, stop at AWAITING_HUMAN_MERGE. Frozen NOT_RUN_AT_SNAPSHOT describes the pre-publication snapshot, not live GitHub state.",
]

